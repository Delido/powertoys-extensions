name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build and sign
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/build.ps1 -Version $version -Pfx $env:SIGNING_PFX -Password $env:SIGNING_PASSWORD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} artifacts/PowerToysExtensions.msix artifacts/Delido.cer install.ps1 --generate-notes
